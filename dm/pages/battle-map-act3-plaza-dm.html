<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Battle Map — Act 3: Extraction Plaza</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --ink:#0B0C0F;
  --wall:#3A3F4A;
  --grid:#232730;
  --accent:#D4AF37;
  --bone:#E9E4D8;
  --muted:#8B8F98;
  --hazard:#C1502E;
  --gray:#9AA3AD;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ink);
  font-family:'JetBrains Mono',monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px;
  color:var(--bone);
}
h1{
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:24px;
  letter-spacing:2px;
  color:var(--accent);
  margin:0 0 4px;
  text-align:center;
}
.subtitle{
  font-size:12px;
  color:var(--muted);
  letter-spacing:1px;
  margin-bottom:18px;
  text-align:center;
}
.map-wrap{
  border:2px solid var(--wall);
  border-radius:4px;
  overflow:auto;
  max-width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  background:#0B0C0F;
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  margin-top:18px;
  font-size:12px;
  color:var(--bone);
  max-width:1100px;
  justify-content:center;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
}
.swatch{
  width:14px;
  height:14px;
  border-radius:3px;
  flex-shrink:0;
}
</style>
</head>
<body>
<h1>Extraction Plaza</h1>
<div class="subtitle">Dis — iron courtyard &nbsp;|&nbsp; 5 ft. squares</div>

<div class="map-wrap">
<svg width="1440" height="920" viewBox="0 0 1440 920" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="920" fill="#0B0C0F"/>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#232730" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Column labels -->
  <g font-family="JetBrains Mono" font-size="11" fill="#8B8F98">
    <text x="140" y="34">A</text><text x="180" y="34">B</text><text x="220" y="34">C</text><text x="260" y="34">D</text>
    <text x="300" y="34">E</text><text x="340" y="34">F</text><text x="380" y="34">G</text><text x="420" y="34">H</text>
    <text x="460" y="34">I</text><text x="500" y="34">J</text><text x="540" y="34">K</text><text x="580" y="34">L</text>
    <text x="620" y="34">M</text><text x="660" y="34">N</text><text x="700" y="34">O</text><text x="740" y="34">P</text>
    <text x="780" y="34">Q</text><text x="820" y="34">R</text><text x="860" y="34">S</text><text x="900" y="34">T</text>
    <text x="940" y="34">U</text><text x="980" y="34">V</text><text x="1020" y="34">W</text><text x="1060" y="34">X</text>
    <text x="1100" y="34">Y</text><text x="1140" y="34">Z</text>
  </g>

  <!-- PLAZA -->
  <rect x="120" y="60" width="1080" height="760" fill="#161820" stroke="#3A3F4A" stroke-width="5"/>
  <rect x="120" y="60" width="1080" height="760" fill="url(#grid)"/>
  <text x="660" y="100" text-anchor="middle" font-family="Cinzel" font-size="20" fill="#D4AF37" font-weight="700">EXTRACTION PLAZA</text>

  <!-- Iron pillars (cover, scattered through plaza) -->
  <g fill="#2A2D34" stroke="#4A4F5A" stroke-width="2">
    <rect x="280" y="200" width="40" height="40"/>
    <rect x="480" y="160" width="40" height="40"/>
    <rect x="700" y="220" width="40" height="40"/>
    <rect x="920" y="180" width="40" height="40"/>
    <rect x="360" y="500" width="40" height="40"/>
    <rect x="600" y="560" width="40" height="40"/>
    <rect x="820" y="520" width="40" height="40"/>
    <rect x="1000" y="580" width="40" height="40"/>
  </g>
  <text x="660" y="440" text-anchor="middle" font-size="10" fill="#8B8F98">IRON PILLARS (half cover)</text>

  <!-- Chokepoint exit toward extraction -->
  <rect x="1200" y="740" width="120" height="60" fill="#2A2418" stroke="#D4AF37" stroke-width="3"/>
  <text x="1260" y="720" text-anchor="middle" font-family="Cinzel" font-size="14" fill="#D4AF37" font-weight="700">CHOKEPOINT</text>
  <text x="1260" y="820" text-anchor="middle" font-size="11" fill="#D4AF37">TO EXTRACTION SHUTTLE</text>

  <!-- Narrow approach to chokepoint -->
  <rect x="1120" y="750" width="80" height="40" fill="#161820" stroke="#3A3F4A" stroke-width="3"/>
  <text x="1160" y="740" text-anchor="middle" font-size="9" fill="#8B8F98">narrow approach — bottleneck</text>

</svg>
</div>

<div class="legend">
  <div class="legend-item"><span class="swatch" style="background:#4A4F5A;"></span>Iron pillars — half cover</div>
  <div class="legend-item"><span class="swatch" style="background:#2A2418;border:1px solid #D4AF37;"></span>Chokepoint — exit toward extraction shuttle</div>
</div>
</body>
</html>
