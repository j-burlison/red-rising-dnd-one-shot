<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../../shared/dm-gate.js"></script>
<title>Battle Map — Act 2: Dis Arcane Library (DM)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --ink:#0B0C0F;
  --wall:#3A3F4A;
  --grid:#232730;
  --accent:#D4AF37;
  --bone:#E9E4D8;
  --muted:#8B8F98;
  --book:#A855F7;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ink);
  font-family:'JetBrains Mono',monospace;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px;
  color:var(--bone);
}
h1{
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:24px;
  letter-spacing:2px;
  color:var(--accent);
  margin:0 0 4px;
  text-align:center;
}
.subtitle{
  font-size:12px;
  color:var(--muted);
  letter-spacing:1px;
  margin-bottom:18px;
  text-align:center;
}
.dm-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  color:#C1502E;
  border:1px solid #C1502E;
  border-radius:3px;
  padding:3px 10px;
  margin-bottom:14px;
}
.map-wrap{
  border:2px solid var(--wall);
  border-radius:4px;
  overflow:auto;
  max-width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  background:#0B0C0F;
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  margin-top:18px;
  font-size:12px;
  color:var(--bone);
  max-width:1100px;
  justify-content:center;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
}
.swatch{
  width:14px;
  height:14px;
  border-radius:3px;
  flex-shrink:0;
}
</style>
</head>
<body>
<h1>Dis Arcane Library</h1>
<div class="subtitle">Main Hall &nbsp;|&nbsp; Records Vault &nbsp;|&nbsp; 5 ft. squares</div>
<div class="dm-tag">DM VERSION — OBJECTIVES MARKED</div>

<div class="map-wrap">
<svg width="1440" height="880" viewBox="0 0 1440 880" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="880" fill="#0B0C0F"/>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#232730" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Column labels -->
  <g font-family="JetBrains Mono" font-size="11" fill="#8B8F98">
    <text x="120" y="34">A</text><text x="160" y="34">B</text><text x="200" y="34">C</text><text x="240" y="34">D</text>
    <text x="280" y="34">E</text><text x="320" y="34">F</text><text x="360" y="34">G</text><text x="400" y="34">H</text>
    <text x="440" y="34">I</text><text x="480" y="34">J</text><text x="520" y="34">K</text><text x="560" y="34">L</text>
    <text x="600" y="34">M</text><text x="640" y="34">N</text><text x="680" y="34">O</text><text x="720" y="34">P</text>
    <text x="760" y="34">Q</text><text x="800" y="34">R</text><text x="840" y="34">S</text><text x="880" y="34">T</text>
    <text x="920" y="34">U</text><text x="960" y="34">V</text><text x="1000" y="34">W</text><text x="1040" y="34">X</text>
  </g>

  <!-- ENTRANCE (from district street) -->
  <rect x="80" y="380" width="40" height="120" fill="#161820" stroke="#3A3F4A" stroke-width="3"/>
  <text x="60" y="440" text-anchor="end" font-family="Cinzel" font-size="13" fill="#D4AF37">FROM DISTRICT STREET</text>

  <!-- MAIN HALL -->
  <rect x="120" y="80" width="880" height="720" fill="#161820" stroke="#3A3F4A" stroke-width="5"/>
  <rect x="120" y="80" width="880" height="720" fill="url(#grid)"/>
  <text x="560" y="120" text-anchor="middle" font-family="Cinzel" font-size="18" fill="#D4AF37" font-weight="700">MAIN HALL</text>

  <!-- Bookshelf rows (cover / difficult terrain) -->
  <g fill="#2E2A22" stroke="#5A4F3A" stroke-width="1.5">
    <rect x="180" y="180" width="30" height="200"/>
    <rect x="260" y="180" width="30" height="200"/>
    <rect x="340" y="180" width="30" height="200"/>
    <rect x="420" y="180" width="30" height="200"/>
    <rect x="500" y="180" width="30" height="200"/>

    <rect x="180" y="460" width="30" height="200"/>
    <rect x="260" y="460" width="30" height="200"/>
    <rect x="340" y="460" width="30" height="200"/>
    <rect x="420" y="460" width="30" height="200"/>
    <rect x="500" y="460" width="30" height="200"/>

    <rect x="620" y="180" width="30" height="480"/>
    <rect x="700" y="180" width="30" height="480"/>
  </g>
  <text x="365" y="700" text-anchor="middle" font-size="10" fill="#8B8F98">BOOKSHELVES (three-quarters cover, difficult terrain)</text>

  <!-- Reading tables -->
  <g fill="#1E211A" stroke="#4A4438" stroke-width="1.5">
    <rect x="560" y="380" width="80" height="40"/>
  </g>

  <!-- Doorway to Records Vault -->
  <rect x="992" y="380" width="8" height="80" fill="#0B0C0F"/>

  <!-- RECORDS VAULT -->
  <rect x="1000" y="280" width="280" height="280" fill="#161820" stroke="#3A3F4A" stroke-width="5"/>
  <rect x="1000" y="280" width="280" height="280" fill="url(#grid)"/>
  <text x="1140" y="315" text-anchor="middle" font-family="Cinzel" font-size="15" fill="#A855F7" font-weight="700">RECORDS VAULT</text>

  <!-- Archivist desk -->
  <rect x="1040" y="350" width="80" height="40" fill="#1E211A" stroke="#4A4438" stroke-width="1.5"/>
  <text x="1080" y="405" text-anchor="middle" font-size="10" fill="#8B8F98">ARCHIVIST DESK</text>

  <!-- Logbook location (DM only) -->
  <circle cx="1200" cy="360" r="10" fill="#A855F7" stroke="#0B0C0F" stroke-width="2"/>
  <text x="1200" y="340" text-anchor="middle" font-size="11" fill="#A855F7" font-weight="500">LOGBOOK</text>

  <!-- Spellbook pedestal (main objective, DM only) -->
  <rect x="1160" y="460" width="60" height="60" fill="#2A2418" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="1190" cy="490" r="14" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <text x="1190" y="540" text-anchor="middle" font-size="11" fill="#D4AF37" font-weight="500">SPELLBOOK</text>
  <text x="1190" y="554" text-anchor="middle" font-size="9" fill="#8B8F98">(pedestal, warded case)</text>

</svg>
</div>

<div class="legend">
  <div class="legend-item"><span class="swatch" style="background:#5A4F3A;"></span>Bookshelves — three-quarters cover, difficult terrain</div>
  <div class="legend-item"><span class="swatch" style="background:#A855F7;border-radius:50%;"></span>The Logbook (discovery beat)</div>
  <div class="legend-item"><span class="swatch" style="background:#D4AF37;"></span>Spellbook objective (warded pedestal)</div>
</div>
</body>
</html>
